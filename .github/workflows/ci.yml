# name: CI

# # Runs the real gates on every push and pull request: typecheck, lint,
# # production build, then the Playwright E2E suite against that build.
# #
# # IMPORTANT: no RESEND_API_KEY secret is configured here, by design. The
# # contact-form and /api/contact E2E specs assert the graceful 503 "email
# # delivery not configured" path (see e2e/contact-form.spec.ts and
# # e2e/contact-api.spec.ts) rather than a real send, which is the only
# # behaviour reachable without a live Resend key. Do not add that secret
# # just to make a "success" path pass — it would defeat the point of this
# # test and this workflow intentionally has no deploy step or secrets.
